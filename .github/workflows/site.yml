name: Site

# Builds https://getdashboard.dev/ into the gh-pages branch, which GitHub Pages serves. The site has
# two parts, each with its own releases and version menu (staged by the dashboard's
# scripts/pages.sh, DOCS_PART):
#
#   dashboard  the docs of stefanrenne/dashboard: latest at /, develop at /develop/
#   widgets    the docs of stefanrenne/dashboard-widgets and a page per widget: latest at
#              /widgets/, develop at /widgets/develop/
#
#   dashboard-develop  /develop/ again, from the dashboard's develop (a push to its develop)
#   dashboard-release  dashboard-develop, then /develop/ copied to / (a push to its main)
#   widgets-develop    /widgets/develop/ again, from the collection's develop (a push to its develop)
#   widgets-release    widgets-develop, then /widgets/develop/ copied to /widgets/ (a collection release)
#   bootstrap          all four: the latest ones from the dashboard's main and the newest
#                      collection release; a first site, or one to start over from
#
# A release is a copy of its part's develop site (the dashboard's scripts/pages-promote.sh): the
# other part is not touched. /version.json has the latest version of each part, for the menus.
# The published widget images, with their .hash files, are the cache: only a widget whose hash
# changed is photographed again, and Playwright starts only when one did. The dashboard's develop
# scripts stage every version.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to build
        type: choice
        options: [dashboard-develop, dashboard-release, widgets-develop, widgets-release, bootstrap]
        default: dashboard-develop

permissions:
  contents: write

# one at a time, in order: each run starts from what the last one published
concurrency:
  group: site
  cancel-in-progress: false

env:
  MODE: ${{ inputs.mode }}
  DASHBOARD: stefanrenne/dashboard
  COLLECTION: stefanrenne/dashboard-widgets

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: What to build
        id: plan
        run: |
          has() { case " $1 " in *" $MODE "*) echo true ;; *) echo false ;; esac; }
          {
            echo "dashboard_develop=$(has 'dashboard-develop dashboard-release bootstrap')"
            echo "dashboard_latest=$(has 'bootstrap')"
            echo "widgets_develop=$(has 'widgets-develop widgets-release bootstrap')"
            echo "widgets_latest=$(has 'bootstrap')"
            echo "main=$(has 'dashboard-release bootstrap')"
            echo "release=$(has 'widgets-release bootstrap')"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.DASHBOARD }}
          ref: develop
          path: dashboard
      - if: steps.plan.outputs.main == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.DASHBOARD }}
          ref: main
          path: dashboard-main
      - if: steps.plan.outputs.widgets_develop == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.COLLECTION }}
          ref: develop
          path: collection-develop
      - name: Newest release of the widgets collection
        id: collection
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view --repo "$COLLECTION" --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.widgets_latest == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.COLLECTION }}
          ref: ${{ steps.collection.outputs.tag }}
          path: collection-release
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci --omit=dev --no-audit --no-fund
        working-directory: dashboard
      - name: The published site (gh-pages), or a new one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q site
          cd site
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin gh-pages; then git checkout -q -b gh-pages FETCH_HEAD; else git checkout -q --orphan gh-pages; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: gem install --user-install --no-document rouge -v 3.30.0

      # stage <name> <part> <source> <tag> [<image cache>]: a develop build of a part (its develop
      # base path) staged in stage-<name>; <source> is the dashboard docs or the collection checkout.
      # In Playwright's image when a widget needs a new picture.
      - name: Stage
        env:
          TAG: ${{ steps.collection.outputs.tag }}
          PLAN_DASHBOARD_DEVELOP: ${{ steps.plan.outputs.dashboard_develop }}
          PLAN_DASHBOARD_LATEST: ${{ steps.plan.outputs.dashboard_latest }}
          PLAN_WIDGETS_DEVELOP: ${{ steps.plan.outputs.widgets_develop }}
          PLAN_WIDGETS_LATEST: ${{ steps.plan.outputs.widgets_latest }}
        run: |
          W=$GITHUB_WORKSPACE
          stage() {
            if [ "$2" = dashboard ]; then
              (cd "$W/dashboard" && DOCS_PART=dashboard DOCS_CHANNEL=develop DOCS_DIR="$3" sh scripts/pages.sh "$W/stage-$1" "$DASHBOARD")
            else
              stale=$(cd "$W/dashboard" && node scripts/widget-images.mjs --stale "$3" --cache "$5")
              echo "stage-$1: $stale widget images to take"
              cmd="cd '$W/dashboard' && DOCS_PART=widgets DOCS_CHANNEL=develop DOCS_IMAGE_CACHE='$5' sh scripts/pages.sh '$W/stage-$1' '$COLLECTION' '$3' '$4'"
              if [ "$stale" -gt 0 ]; then
                v=$(npm view playwright version)
                docker run --rm --ipc=host -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$W:$W" -w "$W" "mcr.microsoft.com/playwright:v$v-noble" \
                  sh -c "cd '$W/dashboard' && npm install --no-save --no-audit --no-fund playwright@$v && $cmd"
              else
                sh -c "$cmd"
              fi
            fi
            ruby "$W/dashboard/scripts/check-highlight.rb" "$W/stage-$1"
          }
          if [ "$PLAN_DASHBOARD_DEVELOP" = true ]; then
            stage dashboard-develop dashboard "$W/dashboard/docs"
          fi
          if [ "$PLAN_DASHBOARD_LATEST" = true ]; then
            # main's docs with develop's menus (main's own may be older than this setup)
            cp -R "$W/dashboard-main/docs" "$W/main-docs"
            mkdir -p "$W/main-docs/_includes"
            cp -R "$W/dashboard/docs/_includes/." "$W/main-docs/_includes/"
            stage dashboard-latest dashboard "$W/main-docs"
          fi
          if [ "$PLAN_WIDGETS_DEVELOP" = true ]; then
            stage widgets-develop widgets "$W/collection-develop" develop "$W/site/widgets/develop/collection/images"
          fi
          if [ "$PLAN_WIDGETS_LATEST" = true ]; then
            # a release from before the collection had docs/: develop's
            [ -d "$W/collection-release/docs" ] || cp -R "$W/collection-develop/docs" "$W/collection-release/docs"
            stage widgets-latest widgets "$W/collection-release" "$TAG" "$W/site/widgets/collection/images"
          fi
          ls -d "$W"/stage-*

      - if: steps.plan.outputs.dashboard_develop == 'true'
        uses: actions/jekyll-build-pages@v1
        with:
          source: stage-dashboard-develop
          destination: built-dashboard-develop
      - if: steps.plan.outputs.dashboard_latest == 'true'
        uses: actions/jekyll-build-pages@v1
        with:
          source: stage-dashboard-latest
          destination: built-dashboard-latest
      - if: steps.plan.outputs.widgets_develop == 'true'
        uses: actions/jekyll-build-pages@v1
        with:
          source: stage-widgets-develop
          destination: built-widgets-develop
      - if: steps.plan.outputs.widgets_latest == 'true'
        uses: actions/jekyll-build-pages@v1
        with:
          source: stage-widgets-latest
          destination: built-widgets-latest

      - name: Publish
        env:
          TAG: ${{ steps.collection.outputs.tag }}
        run: |
          W=$GITHUB_WORKSPACE
          promote="$W/dashboard/scripts/pages-promote.sh"
          sudo chown -R "$(id -u):$(id -g)" built-* 2>/dev/null || true
          dashboard=""
          [ -d dashboard-main ] && dashboard=$(node -p "require('$W/dashboard-main/package.json').version")
          cd site
          if [ -d ../built-dashboard-develop ]; then rm -rf develop && cp -R ../built-dashboard-develop develop; fi
          if [ -d ../built-widgets-develop ]; then mkdir -p widgets && rm -rf widgets/develop && cp -R ../built-widgets-develop widgets/develop; fi
          case "$MODE" in
            dashboard-release) DOCS_PART=dashboard sh "$promote" . "$dashboard" ;;
            widgets-release) DOCS_PART=widgets sh "$promote" . "$TAG" ;;
            bootstrap)
              DOCS_PART=dashboard sh "$promote" . "$dashboard" "$W/built-dashboard-latest"
              DOCS_PART=widgets sh "$promote" . "$TAG" "$W/built-widgets-latest"
              ;;
          esac
          # the latest version of each part, for the menus
          node -e '
            const fs = require("fs");
            let v = {};
            try { v = JSON.parse(fs.readFileSync("version.json", "utf8")); } catch {}
            delete v.release;
            const [mode, dashboard, tag] = process.argv.slice(1);
            if (["dashboard-release", "bootstrap"].includes(mode)) v.dashboard = dashboard;
            if (["widgets-release", "bootstrap"].includes(mode)) v.widgets = tag.replace(/^v/, "");
            fs.writeFileSync("version.json", JSON.stringify(v) + "\n");
          ' "$MODE" "$dashboard" "$TAG"
          # CNAME is GitHub's: Settings > Pages writes it when the domain is set, and it stays
          printf 'User-agent: *\nDisallow: /develop/\nDisallow: /widgets/develop/\n' > robots.txt
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -q -m "$MODE: dashboard develop $(git -C "$W/dashboard" rev-parse --short HEAD), collection $TAG"
          git push -q origin gh-pages
          git log --oneline -1
